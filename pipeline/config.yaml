# Replace the niche before the first run. It is the [niche] placeholder from the carousel.
niche: "REPLACE_WITH_YOUR_NICHE"
timezone: "Asia/Kolkata"
daily_cap: 3
platforms:
  - tiktok
  - instagram
  - youtube
# Posts are scheduled inside this window. 22:00 through 08:00 is quiet.
day_start_hour: 8
day_end_hour: 22
ollama:
  base_url: "http://127.0.0.1:11434/v1"
  model: "qwen2.5:7b"
hypit:
  # Generation models stay off. The reel is the local chat-scene template.
  generation_models: false
  canvas_width: 1080
  canvas_height: 1920
script:
  min_seconds: 20
  max_seconds: 30
openshorts:
  api_url: "http://127.0.0.1:8000"
  # Clipping runs only for these sources. A YouTube watch URL is refused
  # unless it is listed here or belongs to one of these channels.
  allowlist:
    urls: []
    channel_ids: []
    handles: []
    local_dirs: []
upload_post:
  profile: "default"
  api_base: "https://api.upload-post.com"
